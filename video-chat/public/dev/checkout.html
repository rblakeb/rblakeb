<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mock Checkout</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <section class="panel">
    <h1>Mock checkout (dev only)</h1>
    <p class="muted">In production this is the payment processor's hosted checkout (CCBill, Segpay, Epoch).</p>
    <p>Adult day pass: <strong id="price"></strong></p>
    <div class="row">
      <button id="pay" class="primary">Pay</button>
      <button id="cancel">Cancel</button>
    </div>
  </section>
  <script>
    const params = new URLSearchParams(location.search);
    const back = params.get("return") || "/";
    document.getElementById("price").textContent = "$" + (Number(params.get("cents")) / 100).toFixed(2);
    document.getElementById("cancel").onclick = () => (location.href = back);
    document.getElementById("pay").onclick = async () => {
      await fetch("/dev/api/payment-success", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ userId: params.get("user") }),
      });
      location.href = back;
    };
  </script>
</body>
</html>
